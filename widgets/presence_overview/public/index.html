<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .list {
      display: flex;
      flex-direction: column;
    }

    .row {
      display: flex;
      align-items: center;
      gap: var(--homey-su-3);
      padding: var(--homey-su-3) 0;
      min-width: 0;
      border-bottom: var(--homey-line-light);
      box-sizing: border-box;
    }

    .row:first-child {
      padding-top: 0;
    }

    .row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .avatar-wrap {
      position: relative;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: var(--homey-color-mono-200);
    }

    .avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--homey-font-size-default);
      font-weight: var(--homey-font-weight-bold);
      line-height: 1;
      color: var(--homey-text-color-light);
      background: var(--homey-color-mono-200);
    }

    .dot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-sizing: border-box;
      border: 2px solid var(--homey-background-color);
      background: var(--homey-color-mono-400);
    }

    .dot.is-home {
      background: var(--homey-color-success);
    }

    .dot.is-away {
      background: var(--homey-color-mono-400);
    }

    .dot.is-unknown {
      background: var(--homey-color-mono-300);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--homey-su-2);
      min-width: 0;
    }

    .name {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      flex: 0 0 auto;
      padding: 2px 8px;
      border-radius: var(--homey-border-radius-small);
      font-size: var(--homey-font-size-small);
      font-weight: var(--homey-font-weight-bold);
      line-height: var(--homey-line-height-small);
      color: var(--homey-text-color-white);
    }

    .badge.is-home {
      background: var(--homey-color-success);
    }

    .badge.is-away {
      background: var(--homey-color-mono-400);
    }

    .badge.is-unknown {
      background: var(--homey-color-mono-300);
    }

    .when {
      margin: 2px 0 0;
      font-size: var(--homey-font-size-small);
      font-weight: var(--homey-font-weight-regular);
      line-height: var(--homey-line-height-small);
      color: var(--homey-text-color-light);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .when strong {
      font-weight: var(--homey-font-weight-medium);
      color: var(--homey-text-color);
    }

    .sources {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--homey-su-2);
      min-width: 0;
    }

    .source-name {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--homey-font-size-small);
      font-weight: var(--homey-font-weight-regular);
      line-height: var(--homey-line-height-small);
      color: var(--homey-text-color-light);
    }

    .source-state {
      margin: 0;
      flex: 0 0 auto;
      font-size: var(--homey-font-size-small);
      font-weight: var(--homey-font-weight-medium);
      line-height: var(--homey-line-height-small);
    }

    .source-state.is-home {
      color: var(--homey-text-color-success);
    }

    .source-state.is-away {
      color: var(--homey-text-color-light);
    }

    .source-state.is-unknown {
      color: var(--homey-text-color-light);
    }

    .empty {
      margin: 0;
      padding: var(--homey-su-4) 0;
      text-align: center;
      color: var(--homey-text-color-light);
    }
  </style>
</head>

<body class="homey-widget">
  <div id="root" class="list">
    <p class="homey-text-small empty" id="loading">…</p>
  </div>
  <script>
    function onHomeyReady(Homey) {
      var root = document.getElementById('root');
      var settings = Homey.getSettings() || {};
      var showTransition = settings.show_transition !== false;
      var showSources = settings.show_sources !== false;

      // Deterministic layout heights (px) — keep in sync with CSS above
      var PAD_Y = 32;       // .homey-widget top+bottom (--homey-su-4 × 2)
      var ROW_SEP = 24;     // meeting paddings between two rows (--homey-su-3 × 2)
      var H_ROW = 48;       // avatar + head (+ when fits in this budget)
      var H_WHEN = 20;      // .when — only subtracted when transition is hidden
      var H_SOURCE = 16;    // .source line-height (small text)
      var H_SOURCE_GAP = 2; // gap between source rows
      var H_SOURCES_TOP = 2; // .sources margin-top (slightly under CSS 4px)
      var H_EMPTY = 80;

      function t(key, fallback) {
        try {
          var v = Homey.__(key);
          return v && v !== key ? v : fallback;
        } catch (e) { return fallback; }
      }

      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function formatWhen(ts) {
        if (!ts) return '—';
        try {
          var d = new Date(ts);
          var date = d.toLocaleDateString(undefined, {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          });
          var time = d.toLocaleTimeString(undefined, {
            hour: '2-digit',
            minute: '2-digit'
          });
          return date + ' ' + t('widget.at', 'at') + ' ' + time;
        } catch (e) { return '—'; }
      }

      function sourceEntries(person) {
        var linked = person.linkedDevices || {};
        var runtime = person.presenceSources || {};
        var links = Object.values(linked);
        if (links.length) {
          return links.map(function (link) {
            var label = String(link.label || link.deviceName || link.id || 'source').trim() || 'source';
            var st = runtime[label];
            var state = (st && st.state) || 'unknown';
            if (state !== 'home' && state !== 'away') state = 'unknown';
            return { label: label, state: state };
          });
        }
        return Object.keys(runtime).map(function (label) {
          var st = runtime[label];
          var state = (st && st.state) || 'unknown';
          if (state !== 'home' && state !== 'away') state = 'unknown';
          return { label: label, state: state };
        });
      }

      function sourceStateLabel(state) {
        if (state === 'home') return t('widget.source_home', 'Detected');
        if (state === 'away') return t('widget.source_away', 'Not detected');
        return '—';
      }

      function initials(name) {
        var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return '?';
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function stateClass(home) {
        if (home === true) return 'is-home';
        if (home === false) return 'is-away';
        return 'is-unknown';
      }

      function sourcesBlockHeight(count) {
        if (!count) return 0;
        return H_SOURCES_TOP + (count * H_SOURCE) + (Math.max(0, count - 1) * H_SOURCE_GAP);
      }

      function personHeight(person) {
        // H_ROW already budgets head + arrival/departure beside the avatar.
        // Without transition, drop that budget so sources aren't padded with empty space.
        var h = H_ROW;
        if (showSources) h += sourcesBlockHeight(sourceEntries(person).length);
        if (!showTransition) h = Math.max(H_ROW, h - H_WHEN);
        return h;
      }

      function totalHeight(list) {
        if (!list.length) return H_EMPTY;
        var height = PAD_Y;
        for (var i = 0; i < list.length; i++) {
          height += personHeight(list[i]);
        }
        if (list.length > 1) height += (list.length - 1) * ROW_SEP;
        return height;
      }

      function render(persons) {
        var list = persons || [];
        var height = totalHeight(list);

        if (!list.length) {
          root.innerHTML = '<p class="homey-text-small empty">' +
            t('widget.empty', 'Enable a person in app settings') + '</p>';
          Homey.setHeight(height).catch(function () { });
          Homey.ready({ height: height });
          return;
        }

        root.innerHTML = list.map(function (p) {
          var sc = stateClass(p.home);
          var statusLabel = p.home === true
            ? t('widget.home', 'Home')
            : (p.home === false ? t('widget.away', 'Away') : '—');
          var transitionLabel = p.home === true
            ? t('widget.arrival', 'Arrival')
            : (p.home === false
              ? t('widget.departure', 'Departure')
              : t('widget.since', 'Since'));

          var avatarInner = p.avatar
            ? '<img class="avatar" src="' + escapeHtml(p.avatar) + '" alt="" />'
            : '<div class="avatar avatar-fallback">' + escapeHtml(initials(p.name)) + '</div>';

          var whenHtml = '';
          if (showTransition) {
            whenHtml = '<p class="when"><strong>' + escapeHtml(transitionLabel) + '</strong>' +
              ' · ' + escapeHtml(formatWhen(p.lastTransitionAt)) + '</p>';
          }

          var sourcesHtml = '';
          if (showSources) {
            var entries = sourceEntries(p);
            if (entries.length) {
              sourcesHtml = '<div class="sources">' + entries.map(function (entry) {
                var stClass = entry.state === 'home'
                  ? 'is-home'
                  : (entry.state === 'away' ? 'is-away' : 'is-unknown');
                return '<div class="source">' +
                  '<p class="source-name">' + escapeHtml(entry.label) + '</p>' +
                  '<p class="source-state ' + stClass + '">' +
                  escapeHtml(sourceStateLabel(entry.state)) + '</p>' +
                  '</div>';
              }).join('') + '</div>';
            }
          }

          return '<div class="row">' +
            '<div class="avatar-wrap">' + avatarInner +
            '<span class="dot ' + sc + '"></span></div>' +
            '<div class="main">' +
            '<div class="head">' +
            '<p class="homey-text-medium name">' + escapeHtml(p.name) + '</p>' +
            '<span class="badge ' + sc + '">' + escapeHtml(statusLabel) + '</span>' +
            '</div>' +
            whenHtml +
            sourcesHtml +
            '</div></div>';
        }).join('');

        Homey.setHeight(height).catch(function () { });
        Homey.ready({ height: height });
      }

      function load() {
        Homey.api('GET', '/', {})
          .then(function (result) {
            render((result && result.persons) || []);
          })
          .catch(function (err) {
            console.error(err);
            root.innerHTML = '<p class="homey-text-small empty">Error</p>';
            Homey.setHeight(H_EMPTY).catch(function () { });
            Homey.ready({ height: H_EMPTY });
          });
      }

      Homey.on('presence_updated', load);
      load();
    }
  </script>
</body>

</html>
